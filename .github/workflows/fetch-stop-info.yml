name: Temporary - Fetch Metro Cali Stop Information

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-stop-info:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify GTFS ZIP
        run: |
          set -euo pipefail

          if [ ! -f data/gtfs.zip ]; then
            echo "ERROR: data/gtfs.zip was not found."
            exit 1
          fi

          echo "GTFS ZIP:"
          ls -lh data/gtfs.zip

          echo
          echo "Checking ZIP contents..."

          unzip -l data/gtfs.zip | grep -i 'stops.txt'

      - name: Fetch Metro Cali stop information
        run: |
          python scripts/fetch_metro_cali_stop_info.py data/gtfs.zip

      - name: Show summary
        if: always()
        run: |
          if [ -f tmp/metro_cali_stop_info/summary.json ]; then
            cat tmp/metro_cali_stop_info/summary.json
          fi

      - name: Upload Metro Cali stop information
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metro-cali-stop-information
          path: tmp/metro_cali_stop_info/
          retention-days: 7
          if-no-files-found: warn

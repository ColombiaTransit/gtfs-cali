name: (temp) Build temporary calendar

# Manual-only, exploratory workflow for build_temp_calendar.py - see
# gtfs_pipeline/temp_calendar.py for what this actually does and why.
# Not wired into the main gtfs-pipeline.yml build: this doesn't commit
# anything to the repo, it just uploads calendar.txt/calendar_dates.txt
# (plus the console log with the cross-check result) as a workflow
# artifact so they can be inspected before deciding whether to promote
# this into the real pipeline.
#
# Delete this file once the HABIL/SABADO/DOM_FEST hypothesis has been
# confirmed or rejected against real service_id values and either wired
# into gtfs-pipeline.yml properly or abandoned.

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Calendar start date (YYYYMMDD)"
        required: false
        default: "20260101"
      end_date:
        description: "Calendar end date (YYYYMMDD)"
        required: false
        default: "20261231"

concurrency:
  group: build-temp-calendar
  cancel-in-progress: true

env:
  PIPELINE_DIR: gtfs_pipeline
  COMMITTED_ZIP_PATH: data/gtfs.zip   # produced by the main gtfs-pipeline.yml workflow

jobs:
  build-temp-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        working-directory: ${{ env.PIPELINE_DIR }}
        run: pip install -r requirements.txt

      - name: Unit-test the calendar logic first
        working-directory: ${{ env.PIPELINE_DIR }}
        run: |
          python test_colombia_holidays.py
          python test_temp_calendar.py
          python test_diagnose_service_ids.py
          python test_diagnose_service_id_daytypes.py

      - name: Extract data from the last committed feed
        run: |
          mkdir -p "${PIPELINE_DIR}/build/gtfs_raw"
          if [ -f "${COMMITTED_ZIP_PATH}" ]; then
            for f in trips.txt calendar_dates.txt routes.txt stop_times.txt; do
              unzip -p "${COMMITTED_ZIP_PATH}" "$f" > "${PIPELINE_DIR}/build/gtfs_raw/$f" 2>/dev/null \
                && echo "Extracted $f from ${COMMITTED_ZIP_PATH}." \
                || echo "$f not found inside ${COMMITTED_ZIP_PATH} - steps needing it will be skipped."
            done
          else
            echo "No committed feed at ${COMMITTED_ZIP_PATH} yet - the cross-check and " \
                 "diagnostics below will be skipped. (build_temp_calendar.py still runs fine without it.)"
          fi

      - name: Diagnose what the real service_id values actually represent (exception dates)
        working-directory: ${{ env.PIPELINE_DIR }}
        run: python run_diagnose_service_ids.py | tee build/service_id_diagnostic.txt

      - name: Diagnose real service_id day-types (rutas HABIL/SABADO/DOM_FEST windows)
        working-directory: ${{ env.PIPELINE_DIR }}
        run: python run_diagnose_service_id_daytypes.py | tee build/service_id_daytype_diagnostic.txt

      - name: Build temporary calendar.txt / calendar_dates.txt
        working-directory: ${{ env.PIPELINE_DIR }}
        run: |
          python build_temp_calendar.py \
            --start "${{ inputs.start_date }}" \
            --end "${{ inputs.end_date }}" \
            | tee build/temp_calendar_log.txt

      - name: Upload results as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: temp-calendar
          path: |
            ${{ env.PIPELINE_DIR }}/build/gtfs_raw/calendar.txt
            ${{ env.PIPELINE_DIR }}/build/gtfs_raw/calendar_dates.txt
            ${{ env.PIPELINE_DIR }}/build/temp_calendar_log.txt
            ${{ env.PIPELINE_DIR }}/build/service_id_diagnostic.txt
            ${{ env.PIPELINE_DIR }}/build/service_id_daytype_diagnostic.txt
            ${{ env.PIPELINE_DIR }}/build/report/service_id_daytype_analysis.csv
            ${{ env.PIPELINE_DIR }}/build/report/service_id_daytype_summary.csv
          retention-days: 14

      - name: Summary
        working-directory: ${{ env.PIPELINE_DIR }}
        run: |
          {
            echo "### Temporary calendar build"
            echo ""
            echo "Range: \`${{ inputs.start_date }}\` - \`${{ inputs.end_date }}\`"
            echo ""
            echo "#### service_id cross-check (HABIL/SABADO/DOM_FEST hypothesis)"
            echo "\`\`\`"
            grep -A5 "Cross-check against real" build/temp_calendar_log.txt || echo "(no trips.txt available for cross-check)"
            echo "\`\`\`"
            echo ""
            echo "#### Real service_id diagnostic (exception dates)"
            echo "\`\`\`"
            cat build/service_id_diagnostic.txt
            echo "\`\`\`"
            echo ""
            echo "#### Real service_id diagnostic (rutas day-type windows)"
            echo "\`\`\`"
            cat build/service_id_daytype_diagnostic.txt
            echo "\`\`\`"
            echo ""
            echo "Full files are attached as the \`temp-calendar\` artifact on this run."
          } >> "$GITHUB_STEP_SUMMARY"
